      - name: Copy generic public assets from the template
        run: |
          if [ ! -d public/images ]; then
            git clone --depth 1 https://github.com/ItsJavierLomelin/webflow-fixora-site-template.git /tmp/tpl
            mkdir -p public
            cp -r /tmp/tpl/public/images public/images
          fi
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add site source"
          git push origin HEAD:main || true
      - run: npm ci
      - run: npm run build
        env:
          BASE: /waukee-hydro-jetting-pros
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
